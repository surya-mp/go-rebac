name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true
      - run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -run=^$ -fuzz=FuzzParseUserset -fuzztime=5s .
      - run: go test -run=^$ -fuzz=FuzzValidateTuple -fuzztime=5s .
      - run: go test -run=^$ -fuzz=FuzzValidateModel -fuzztime=5s .
      - run: go test -run=^$ -fuzz=FuzzTenantIsolation -fuzztime=5s .
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go run github.com/anchore/syft/cmd/syft@v1.52.0 dir:. -o go-rebac.spdx.json
      - run: sha256sum go-rebac.spdx.json > go-rebac.spdx.json.sha256
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - run: cosign sign-blob --yes --bundle go-rebac.spdx.json.bundle go-rebac.spdx.json
      - run: gh release create "$GITHUB_REF_NAME" go-rebac.spdx.json go-rebac.spdx.json.sha256 go-rebac.spdx.json.bundle --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
